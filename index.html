<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom QR Code Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        canvas {
            max-width: 100%;
            height: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 overflow-hidden">
        
        <!-- Left Column: Controls -->
        <div class="p-8 bg-gray-50 border-b md:border-b-0 md:border-r border-gray-200">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">QR 코드 생성기</h1>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="qr-data">데이터 (URL 또는 텍스트) <span class="text-red-500">*</span></label>
                    <input type="text" id="qr-data" placeholder="https://example.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" value="https://example.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="qr-title">상단 제목 (선택)</label>
                    <input type="text" id="qr-title" placeholder="나만의 QR코드" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="qr-logo">가운데 로고 이미지 (선택)</label>
                    <input type="file" id="qr-logo" accept="image/png, image/jpeg, image/jpg" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-all cursor-pointer">
                    <p class="text-xs text-gray-500 mt-1">정사각형에 가까운 이미지가 가장 잘 보입니다.</p>
                </div>

                <div class="pt-4 flex flex-col sm:flex-row gap-3">
                    <button id="btn-generate" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow transition-colors focus:ring-4 focus:ring-blue-300">
                        생성하기
                    </button>
                    <button id="btn-download" class="flex-1 bg-gray-800 hover:bg-gray-900 text-white font-semibold py-2.5 px-4 rounded-lg shadow transition-colors focus:ring-4 focus:ring-gray-300 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        다운로드
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Column: Preview -->
        <div class="p-8 flex flex-col items-center justify-center bg-white min-h-[400px]">
            <h2 class="text-sm font-medium text-gray-400 mb-4 uppercase tracking-wider">Preview</h2>
            <div id="canvas-container" class="w-full flex justify-center items-center">
                <!-- 캔버스가 그려질 공간 -->
                <canvas id="qr-canvas" class="hidden"></canvas>
                <div id="placeholder" class="text-gray-400 text-center flex flex-col items-center">
                    <svg class="w-16 h-16 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m8-8H4"></path></svg>
                    <p>데이터를 입력하고 생성하기를 눌러주세요</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputData = document.getElementById('qr-data');
        const inputTitle = document.getElementById('qr-title');
        const inputLogo = document.getElementById('qr-logo');
        const btnGenerate = document.getElementById('btn-generate');
        const btnDownload = document.getElementById('btn-download');
        const canvas = document.getElementById('qr-canvas');
        const placeholder = document.getElementById('placeholder');
        const ctx = canvas.getContext('2d');

        let loadedLogoImage = null;

        // Handle File Input (Logo)
        inputLogo.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = () => {
                        loadedLogoImage = img;
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            } else {
                loadedLogoImage = null;
            }
        });

        // Generate QR Code
        btnGenerate.addEventListener('click', async () => {
            const data = inputData.value.trim();
            const title = inputTitle.value.trim();

            if (!data) {
                alert('QR 코드에 들어갈 데이터를 입력해주세요.');
                return;
            }

            try {
                // 1. 라이브러리를 통해 기본 QR코드 이미지를 Data URL로 생성
                // 오류 복원율을 H(High, 30%)로 설정하여 중앙이 가려져도 인식되게 함
                const qrDataUrl = await QRCode.toDataURL(data, {
                    errorCorrectionLevel: 'H',
                    margin: 2,
                    width: 400,
                    color: {
                        dark: '#000000',
                        light: '#ffffff'
                    }
                });

                // QR 이미지를 Image 객체로 로드
                const qrImg = new Image();
                qrImg.src = qrDataUrl;
                
                qrImg.onload = () => {
                    renderFinalCanvas(qrImg, title, loadedLogoImage);
                };

            } catch (error) {
                console.error("QR코드 생성 중 오류 발생:", error);
                alert("QR코드 생성에 실패했습니다.");
            }
        });

        function renderFinalCanvas(qrImg, title, logoImg) {
            const qrSize = qrImg.width;
            let titleHeight = 0;
            const padding = 20;

            // 타이틀이 있을 경우 캔버스 상단에 여백 추가
            if (title) {
                titleHeight = 60;
            }

            // 캔버스 크기 설정
            canvas.width = qrSize;
            canvas.height = qrSize + titleHeight;

            // 1. 전체 배경을 흰색으로 채우기
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. 제목 텍스트 그리기 (가운데 정렬)
            if (title) {
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 24px sans-serif'; // 시스템 폰트 사용
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // 텍스트 위치: X는 중앙, Y는 상단 여백의 중앙
                ctx.fillText(title, canvas.width / 2, titleHeight / 2 + 10);
            }

            // 3. QR코드 이미지 그리기 (제목 아래)
            ctx.drawImage(qrImg, 0, titleHeight, qrSize, qrSize);

            // 4. 로고 이미지 그리기 (QR코드 중앙)
            if (logoImg) {
                // 로고 크기는 QR코드 크기의 약 22% 정도로 설정 (너무 크면 인식 불가)
                const logoMaxSize = qrSize * 0.22; 
                
                // 로고의 원본 비율 유지 계산
                let logoWidth = logoImg.width;
                let logoHeight = logoImg.height;
                const ratio = Math.min(logoMaxSize / logoWidth, logoMaxSize / logoHeight);
                logoWidth = logoWidth * ratio;
                logoHeight = logoHeight * ratio;

                // QR 영역 중앙 좌표 계산
                const centerX = (qrSize - logoWidth) / 2;
                const centerY = titleHeight + (qrSize - logoHeight) / 2;

                // (선택 사항) 로고 뒤에 흰색 배경을 깔아주어 가독성을 높일 수 있습니다.
                const bgPadding = 4;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(centerX - bgPadding, centerY - bgPadding, logoWidth + (bgPadding*2), logoHeight + (bgPadding*2));

                // 로고 그리기
                ctx.drawImage(logoImg, centerX, centerY, logoWidth, logoHeight);
            }

            // UI 업데이트: 캔버스 보여주고 버튼 활성화
            placeholder.classList.add('hidden');
            canvas.classList.remove('hidden');
            btnDownload.disabled = false;
        }

        // Download logic
        btnDownload.addEventListener('click', () => {
            const dataUrl = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = 'custom-qr-code.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
        
        // 초기 렌더링 시 자동으로 한 번 생성 (옵션)
        // btnGenerate.click(); 
    </script>
</body>
</html>
